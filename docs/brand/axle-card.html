<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 627px;
    background: #0f1420;
    font-family: Georgia, 'Times New Roman', serif;
    display: flex; align-items: center; justify-content: center;
    position: relative; overflow: hidden;
  }
  .road {
    position: absolute; left: 0; right: 0; top: 388px; height: 2px;
    background: linear-gradient(90deg, transparent 0%, #2a3550 12%, #2a3550 88%, transparent 100%);
  }
  .dash {
    position: absolute; top: 387px; left: 0; right: 0; height: 4px;
    background: repeating-linear-gradient(90deg, transparent 0 46px, #c8a24a 46px 74px);
    opacity: 0.55;
    mask-image: linear-gradient(90deg, transparent 0%, #000 15%, #000 85%, transparent 100%);
    -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 15%, #000 85%, transparent 100%);
  }
  .wrap { text-align: center; position: relative; }
  .name {
    color: #f4f1ea; font-size: 168px; letter-spacing: 2px; font-weight: normal;
    line-height: 1;
  }
  .name .accent { color: #c8a24a; }
  .sub {
    margin-top: 58px;
    color: #8b96ad; font-size: 30px; letter-spacing: 10px;
    font-family: Arial, Helvetica, sans-serif; text-transform: uppercase;
  }
</style>
</head>
<body>
  <div class="road"></div>
  <div class="dash"></div>
  <div class="wrap">
    <div class="name">Axle<span class="accent">.</span></div>
    <div class="sub">AI-Powered Used-Car Platform</div>
  </div>
</body>
</html>
